# CPU-Optimized Model Configurations
# Optimized for CPU inference with MatMul-free operations

# Small models optimized for CPU inference
cpu_small_370M:
  # Based on paper's 370M model but optimized for CPU
  vocab_size: 50000
  hidden_size: 1024
  num_hidden_layers: 24
  num_heads: 8
  max_position_embeddings: 2048
  expand_ratio: 1
  hidden_ratio: 4
  rms_norm_eps: 1.0e-6
  use_cache: true  # Enable for inference
  gradient_checkpointing: false  # Not needed for inference
  # CPU-specific optimizations
  cpu_optimized: true
  use_matmul_free: true
  threading_strategy: "auto"
  
# Compact model for edge devices and Apple Silicon
cpu_compact_160M:
  vocab_size: 50000
  hidden_size: 768
  num_hidden_layers: 16
  num_heads: 8
  max_position_embeddings: 1024
  expand_ratio: 1
  hidden_ratio: 3
  rms_norm_eps: 1.0e-6
  use_cache: true
  gradient_checkpointing: false
  # Optimized for mobile/edge
  cpu_optimized: true
  use_matmul_free: true
  threading_strategy: "conservative"  # Use fewer threads
  memory_efficient: true

# Medium model for desktop/server CPU inference
cpu_medium_1.3B:
  vocab_size: 50000
  hidden_size: 2048
  num_hidden_layers: 24
  num_heads: 16
  max_position_embeddings: 2048
  expand_ratio: 1
  hidden_ratio: 4
  rms_norm_eps: 1.0e-6
  use_cache: true
  gradient_checkpointing: false
  # Server-grade CPU optimization
  cpu_optimized: true
  use_matmul_free: true
  threading_strategy: "aggressive"  # Use all available cores
  
# Apple Silicon specific optimizations
apple_silicon_370M:
  # Inherits from cpu_small_370M but with Apple-specific optimizations
  <<: *cpu_small_370M
  # Apple Silicon specific settings
  target_architecture: "apple_silicon"
  use_metal_performance_shaders: false  # Future: Metal integration
  memory_layout: "apple_optimized"
  simd_width: 4  # NEON width
  cache_block_size: 64  # Optimized for Apple Silicon cache

# Intel/AMD x86_64 specific optimizations  
x86_64_370M:
  <<: *cpu_small_370M
  # x86_64 specific settings
  target_architecture: "x86_64"
  simd_instruction_set: "avx2"  # Will auto-detect AVX2/AVX-512
  memory_layout: "x86_optimized"
  simd_width: 8  # AVX2 width (16 for AVX-512)
  cache_block_size: 64

# ARM64 Linux server optimizations
arm64_server_1.3B:
  <<: *cpu_medium_1.3B
  target_architecture: "arm64"
  simd_instruction_set: "neon"
  memory_layout: "arm64_optimized"
  simd_width: 4  # NEON width
  threading_strategy: "numa_aware"  # For multi-socket ARM servers

# Hardware-specific threading configurations
threading_configs:
  conservative:
    # For mobile/edge devices
    max_threads: 4
    thread_affinity: true
    numa_aware: false
    
  auto:
    # Automatic detection based on hardware
    max_threads: "auto"  # Will use omp_get_max_threads()
    thread_affinity: true
    numa_aware: "auto"
    
  aggressive:
    # For high-end desktop/server
    max_threads: "all"
    thread_affinity: true
    numa_aware: true
    hyperthreading: true

# Memory layout optimizations
memory_layouts:
  apple_optimized:
    # Optimized for Apple Silicon unified memory
    weight_packing: "ternary_2bit"
    activation_caching: true
    prefetch_strategy: "sequential"
    
  x86_optimized:
    # Optimized for x86_64 cache hierarchy
    weight_packing: "ternary_2bit"
    activation_caching: true
    prefetch_strategy: "adaptive"
    cache_line_alignment: 64
    
  arm64_optimized:
    # Optimized for ARM64 servers
    weight_packing: "ternary_2bit"
    activation_caching: true
    prefetch_strategy: "numa_aware"
    cache_line_alignment: 64

# Inference-specific optimizations
inference_optimizations:
  # Quantization settings
  weight_quantization: "ternary"  # {-1, 0, 1}
  activation_quantization: "int8"  # 8-bit activations
  
  # Memory optimizations
  kv_cache_quantization: "int8"
  gradient_checkpointing: false
  use_cache: true
  
  # Compute optimizations
  fused_operations: true
  kernel_fusion: true
  loop_unrolling: true
  
  # Platform-specific
  use_blas: false  # We implement our own MatMul-free operations
  use_mkl: false   # Not needed for MatMul-free
  use_accelerate: false  # macOS Accelerate framework (future consideration)
