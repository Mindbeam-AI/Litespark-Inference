# Training configurations for different model sizes and batch configurations

# Small model (257M params) - fits easily on 4x A10G
small_model:
  vocab_size: 50000
  hidden_size: 1024
  num_layers: 12
  num_heads: 8
  max_seq_length: 2048
  expand_ratio: 1
  hidden_ratio: 4
  attn_mode: "fused_recurrent"

# Medium model (370M params) - matches paper
medium_model:
  vocab_size: 50000
  hidden_size: 1024
  num_layers: 24
  num_heads: 8
  max_seq_length: 2048
  expand_ratio: 1
  hidden_ratio: 4
  attn_mode: "fused_recurrent"

# Large model (1.3B params) - requires more GPUs or gradient accumulation
large_model:
  vocab_size: 50000
  hidden_size: 2048
  num_layers: 24
  num_heads: 16
  max_seq_length: 2048
  expand_ratio: 1
  hidden_ratio: 4
  attn_mode: "fused_recurrent"

# Training configurations

# Conservative - for 4x A10G (24GB each)
conservative_training:
  seq_length: 512
  batch_size: 2
  gradient_accumulation_steps: 2
  # Effective batch = 2 * 4 GPUs * 2 accum = 16
  learning_rate: 3e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  total_steps: 10000

# Balanced - for 4x A10G with good utilization
balanced_training:
  seq_length: 1024
  batch_size: 4
  gradient_accumulation_steps: 1
  # Effective batch = 4 * 4 GPUs * 1 accum = 16
  learning_rate: 3e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  total_steps: 10000

# Aggressive - push memory limits, larger batches
aggressive_training:
  seq_length: 1024
  batch_size: 4
  gradient_accumulation_steps: 4
  # Effective batch = 4 * 4 GPUs * 4 accum = 64
  learning_rate: 4e-4  # Slightly higher LR for larger batch
  weight_decay: 0.1
  max_grad_norm: 1.0
  total_steps: 10000

# Paper-like - try to match paper's batch_size=256
paper_like_training:
  seq_length: 1024
  batch_size: 8
  gradient_accumulation_steps: 8
  # Effective batch = 8 * 4 GPUs * 8 accum = 256
  learning_rate: 5e-4  # Higher LR for large batch
  weight_decay: 0.1
  max_grad_norm: 1.0
  total_steps: 10000

# Quick test - for debugging
debug_training:
  seq_length: 128
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 3e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  total_steps: 100

# Example usage:
# python train_ddp.py \
#   --data_dir SlimPajama-6B-nanotron/train \
#   --save_dir checkpoints/medium_balanced \
#   --hidden_size 1024 \
#   --num_layers 24 \
#   --seq_length 1024 \
#   --batch_size 4 \
#   --gradient_accumulation_steps 1 \
#   --total_steps 10000
