[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litespark-inference"
version = "1.0.1"
description = "Efficient CPU inference for ternary language models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Nii Osae Osae Dade", email = "stark@mindbeam.ai"},
    {name = "Tony Morri", email = "tony.morri@mindbeam.ai"},
    {name = "Sayandip Pal", email = "dip.pal@mindbeam.ai"},
]
maintainers = [
    {name = "Tony Morri", email = "tony.morri@mindbeam.ai"},
    {name = "Sayandip Pal", email = "dip.pal@mindbeam.ai"},
    {name = "Nii Osae Osae Dade", email = "stark@mindbeam.ai"},
]
keywords = ["bitnet", "llm", "inference", "cpu", "simd", "ternary", "litespark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Torchless runtime
    "numpy>=1.24",
    "tokenizers>=0.14",
    "safetensors>=0.3.0",
    "huggingface_hub>=0.16.0",
    # Torch-backed path (Falcon Edge models, the legacy CLI dispatcher,
    # the PyTorch baseline in benchmark_kernel.py / tests/arm_compat).
    # If/when the torchless runtime gets a Falcon loader these can move
    # under [project.optional-dependencies] torch-backend.
    "torch>=2.4.0",
    "transformers>=4.30.0",
    # transformers >= 5.x's BitNet loader hard-requires accelerate at
    # `from_pretrained` time, even for the bf16 (non-quantized) checkpoint.
    # Earlier transformers versions pulled accelerate in transitively;
    # 5.x does not, so we have to declare it explicitly here. Cross-platform
    # pure-Python wheel on PyPI, available on macOS/Linux/Windows.
    "accelerate>=0.26.0",
    "ninja>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
litespark-inference = "litespark_inference.cli:main"
litespark-benchmark = "litespark_inference.benchmark_kernel:main"

[project.urls]
Homepage = "https://github.com/Mindbeam-AI/Litespark-Inference"
Documentation = "https://github.com/Mindbeam-AI/Litespark-Inference#readme"
Repository = "https://github.com/Mindbeam-AI/Litespark-Inference"

[tool.setuptools.packages.find]
include = ["litespark_inference*"]

[tool.setuptools.package-data]
"litespark_inference.kernels.arm64" = ["*.cpp"]
"litespark_inference.kernels.x86_64" = ["*.cpp"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
